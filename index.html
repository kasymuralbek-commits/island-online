<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Island Online</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    background:#111827;
    color:white;
    font-family:Arial,sans-serif;
    overflow:hidden;
}
#game{
    width:100vw;
    height:100vh;
    position:relative;
    background:#2196d2;
}
#island{
    position:absolute;
    width:700px;
    height:500px;
    max-width:90vw;
    max-height:70vh;
    left:50%;
    top:48%;
    transform:translate(-50%,-50%);
    background:#55b94a;
    border:18px solid #e6c16a;
    border-radius:48% 52% 45% 55%;
    box-shadow:0 0 0 18px #168ac0;
}
.tree{
    position:absolute;
    font-size:45px;
}
#player{
    position:absolute;
    font-size:38px;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    transition:.1s;
}
#top{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;
    display:flex;
    justify-content:space-between;
    gap:10px;
    z-index:5;
}
.panel{
    background:rgba(0,0,0,.65);
    padding:10px 14px;
    border-radius:12px;
}
#chat{
    position:absolute;
    bottom:10px;
    left:10px;
    width:300px;
    max-width:calc(100vw - 20px);
    background:rgba(0,0,0,.7);
    border-radius:12px;
    padding:10px;
    z-index:5;
}
#messages{
    height:120px;
    overflow:auto;
    margin-bottom:8px;
    font-size:14px;
}
#msg{
    width:70%;
    padding:9px;
    border:0;
    border-radius:8px;
}
button{
    padding:9px 12px;
    border:0;
    border-radius:8px;
    background:#22c55e;
    color:white;
    font-weight:bold;
}
#voice{
    background:#7c3aed;
}
#hint{
    position:absolute;
    bottom:10px;
    right:10px;
    background:rgba(0,0,0,.65);
    padding:10px;
    border-radius:10px;
}
</style>
</head>

<body>

<div id="game">

    <div id="top">
        <div class="panel">🏝️ Island Online</div>
        <div class="panel">
            ❤️ <span id="hp">100</span>
            🍎 <span id="food">100</span>
        </div>
    </div>

    <div id="island">
        <div class="tree" style="left:12%;top:18%">🌴</div>
        <div class="tree" style="left:75%;top:15%">🌴</div>
        <div class="tree" style="left:25%;top:68%">🌳</div>
        <div class="tree" style="left:70%;top:65%">🌳</div>
        <div class="tree" style="left:45%;top:25%">🌲</div>

        <div id="player">🧑</div>
    </div>

    <div id="chat">
        <b>💬 Чат</b>
        <div id="messages">
            <div>Система: Добро пожаловать!</div>
        </div>

        <input id="msg" placeholder="Напиши сообщение...">
        <button onclick="sendMessage()">➤</button>
        <button id="voice" onclick="startVoice()">🎙️</button>
    </div>

    <div id="hint">
        🎮 Управление: WASD / стрелки
    </div>

</div>

<script>
const player = document.getElementById("player");

let x = 50;
let y = 50;
let speed = 2;

document.addEventListener("keydown", e => {

    const key = e.key.toLowerCase();

    if(key === "w" || key === "arrowup") y -= speed;
    if(key === "s" || key === "arrowdown") y += speed;
    if(key === "a" || key === "arrowleft") x -= speed;
    if(key === "d" || key === "arrowright") x += speed;

    x = Math.max(8, Math.min(92,x));
    y = Math.max(8, Math.min(92,y));

    player.style.left = x + "%";
    player.style.top = y + "%";
});

function sendMessage(){

    const input = document.getElementById("msg");
    const text = input.value.trim();

    if(!text) return;

    const messages = document.getElementById("messages");

    const line = document.createElement("div");
    line.textContent = "Ты: " + text;

    messages.appendChild(line);

    messages.scrollTop = messages.scrollHeight;

    input.value = "";
}

document.getElementById("msg").addEventListener("keydown",e=>{
    if(e.key === "Enter") sendMessage();
});

async function startVoice(){

    try{

        const stream = await navigator.mediaDevices.getUserMedia({
            audio:true
        });

        alert("🎙️ Микрофон разрешён!\n\nНастоящий голосовой чат между игроками подключим через WebRTC-сервер.");

        stream.getTracks().forEach(track=>{
            track.stop();
        });

    }catch(error){

        alert("❌ Нет доступа к микрофону.");
    }
}
</script>

</body>
</html>
